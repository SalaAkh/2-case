<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Zero-Spoiler — зертте, түсіндір, қолдан</title>
  <desc id="desc">Tomorrow School жобасы: қатені зерттеп, ережені түсіндіріп, жаңа жағдайда қолдану.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width=".6"/></pattern>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#d3f950" stop-opacity=".06"/><stop offset="1" stop-color="#d3f950" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="458" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="760" y="24" width="494" height="412" fill="url(#grid)" opacity=".6"/>
  <rect x="24" y="24" width="1232" height="412" rx="14" fill="url(#glow)"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="56" y="46" width="36" height="36" rx="9" fill="#d3f950"/>
    <path d="M67 71L81 57M68 57H81V70" fill="none" stroke="#101112" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106" y="72" fill="#e6edf3" font-size="26" font-weight="700">tomorrow<tspan fill="#d3f950">.</tspan></text>
    <text x="56" y="127" fill="#9da7b3" font-size="12" letter-spacing="2">TOMORROW SCHOOL / LEARNING WORKSPACE</text>
    <text x="52" y="207" fill="#f0f6fc" font-size="62" font-weight="700" letter-spacing="-2">Zero-Spoiler</text>
    <text x="56" y="270" fill="#e6edf3" font-size="34" font-weight="600">Себебін түсіну.</text>
    <text x="56" y="315" fill="#e6edf3" font-size="34" font-weight="600">Ережені қолдану.</text>
    <text x="56" y="364" fill="#d3f950" font-size="20" font-weight="600">Зертте. Түсіндір. Қолдан.</text>
    <text x="56" y="413" fill="#9da7b3" font-size="15">Сұрақтар мен бақылаулар арқылы бағдарламалау практикасы.</text>
    <rect x="792" y="134" width="432" height="252" rx="13" fill="#161b22" stroke="#30363d"/>
    <path d="M793 176H1223" stroke="#30363d"/>
    <circle cx="814" cy="155" r="4" fill="#f85149"/><circle cx="829" cy="155" r="4" fill="#d29922"/><circle cx="844" cy="155" r="4" fill="#3fb950"/>
    <text x="868" y="159" fill="#9da7b3" font-size="12" font-family="DejaVu Sans Mono, monospace">index.py</text>
    <g font-family="DejaVu Sans Mono, monospace" font-size="15">
      <text x="812" y="211" fill="#6e7681">1</text><text x="841" y="211" fill="#e6edf3">numbers = [<tspan fill="#a5d6ff">1, 2, 3, 4, 5</tspan>]</text>
      <text x="812" y="245" fill="#6e7681">2</text><text x="841" y="245" fill="#ff7b72">for<tspan fill="#e6edf3"> i in range(len(numbers) + 1):</tspan></text>
      <text x="812" y="279" fill="#6e7681">3</text><text x="841" y="279" fill="#e6edf3">  <tspan fill="#d2a8ff">print</tspan>(numbers[i])</text>
    </g>
    <rect x="812" y="307" width="392" height="58" rx="8" fill="#222a1c" stroke="#4a5c2c"/>
    <circle cx="835" cy="336" r="10" fill="none" stroke="#d3f950"/>
    <text x="832" y="341" fill="#d3f950" font-size="14" font-weight="700">?</text>
    <text x="856" y="341" fill="#d3f950" font-size="16">i = 5 кезінде не болады?</text>
    <text x="804" y="414" fill="#9da7b3" font-size="12" letter-spacing="1.3">БОЛЖАУ → ТЕКСЕРУ → ТҮСІНДІРУ</text>
  </g>
</svg>
